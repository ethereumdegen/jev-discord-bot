[package]
name = "jev-discord-bot"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
publish = false
license = "MIT"
repository = "https://github.com/ethereumdegen/jev-discord-bot"
description = "Jev Mod: a Discord spam bot any server can add. Jev (TypeSafe) judges messages; owners set a warn/kick/ban ladder and read an audit log."

[lib]
name = "jev_discord_bot"
path = "src/lib.rs"

[[bin]]
name = "jevmod"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.8", features = ["macros"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
jev = { version = "0.1.0", features = ["async"] }
# Version 10 panics at the first verify unless a crypto backend feature is chosen.
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
rand = "0.9.2"
redis = { version = "1.7.0", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "connection-manager", "streams", "tls-rustls-webpki-roots"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "time", "process"] }
tower-http = { version = "0.6.6", features = ["catch-panic", "compression-gzip", "set-header", "trace", "fs"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
twilight-gateway = { version = "0.17.1", default-features = false, features = ["rustls-webpki-roots", "zlib"] }
twilight-model = "0.17.1"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.3"
pgtemp = "0.7"
tower = { version = "0.5.2", features = ["util"] }
